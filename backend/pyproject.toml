[project]
name = "pmis-backend"
version = "0.1.0"
description = "PMIS 後端（FastAPI ＋ PostgreSQL）"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------- ruff：lint ＋ format ----------
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle 錯誤
    "W",     # pycodestyle 警告
    "F",     # pyflakes：未使用的 import / 變數、未定義的名稱
    "I",     # import 排序
    "B",     # flake8-bugbear：常見陷阱（可變的預設值等）
    "UP",    # pyupgrade：改用目前 Python 版本的寫法
    "ASYNC", # async 函式裡的阻塞呼叫（同步 I/O、time.sleep…）
    "FAST",  # FastAPI：依賴寫成 Annotated、路徑參數要有對應的函式參數
    "DTZ",   # datetime 一律帶時區（正式環境的容器是 UTC）
    "PTH",   # 路徑用 pathlib 組（程式要能在 Linux 上執行）
    "C4",    # list / dict / set comprehension 的寫法
    "SIM",   # 可以更簡單的寫法
    "T20",   # 不留 print，要輸出訊息用 logging
    "RUF",   # ruff 自己的規則
]
ignore = [
    "E501",   # 行長交給 ruff format；中文註解與訊息不強制折行
    "RUF001", # 以下三條會把全形標點（，：（）…）當成易混淆字元；
    "RUF002", # 中文註解、docstring 與訊息本來就用全形標點
    "RUF003",
]

# ---------- mypy：型別檢查 ----------
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
